<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Campora | Messages</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="./css/owner-v3.css">
    <style>
        .chat-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; height: calc(100vh - 140px); min-height: 500px; }
        .chat-list { overflow-y: auto; }
        .chat-thread { display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
        .msg-owner { align-self: flex-end; background: linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; border-bottom-right-radius: 4px; }
        .msg-student { align-self: flex-start; background: rgba(255,255,255,.08); color:#fff; border-bottom-left-radius: 4px; }
        .msg-time { font-size: 11px; opacity:.7; margin-top:4px; }
        .conv-item { transition:.2s; cursor:pointer; }
        .conv-item:hover, .conv-item.active { background: rgba(37,99,235,.12); }
        .chat-input-bar { display:flex; gap:10px; padding:12px; border-top:1px solid rgba(255,255,255,.06); }
        .chat-input-bar input { flex:1; }
        @media(max-width:768px){ .chat-layout{ grid-template-columns:1fr; } .chat-list{ max-height:300px; } }
    </style>
    <link rel="icon" href="./images/logo.png" type="image/png">

    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body class="v3-body">

<div class="v3-bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
</div>

<div id="toastContainer" class="v3-toast-container" aria-live="polite" aria-atomic="true"></div>

<main class="v3-content chat-layout" id="mainContent" role="main">

        <!-- Conversation List -->
        <div class="v3-card chat-list" style="padding:0;overflow:hidden">
            <div style="padding:18px;border-bottom:1px solid rgba(255,255,255,.06)">
                <h2 style="font-size:20px;font-weight:800">Inbox</h2>
            </div>
            <div id="conversationList">
                <div class="v3-loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading conversations...</div>
            </div>
        </div>

        <!-- Chat Thread -->
        <div class="v3-card chat-thread" style="padding:0;overflow:hidden">
            <div id="chatHeader" style="padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:14px">
                <div class="v3-avatar" style="width:46px;height:46px;font-size:18px" id="chatAvatar">S</div>
                <div>
                    <h3 id="chatStudentName" style="font-size:18px;font-weight:800">Select a conversation</h3>
                    <p id="chatStudentMeta" style="color:var(--v3-muted);font-size:13px">Choose a student to start chatting</p>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="v3-empty" style="padding:40px"><i class="fa-solid fa-comments"></i><h3>No conversation selected</h3><p>Select a student from the inbox to view messages.</p></div>
            </div>
            <div class="chat-input-bar" id="chatInputBar" style="display:none">
                <input type="text" id="chatInput" placeholder="Type a message..." aria-label="Type a message">
                <button class="v3-btn v3-btn-primary" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

</main>

<div id="sidebarBackdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:998" hidden></div>

<script type="module">
import { initShell } from "./js/owner-shell.js";
initShell("Messages");
</script>
<script type="module" src="./js/owner-messages.js"></script>
</body>
</html>
