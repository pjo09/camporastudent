<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign In • Campora</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #070d1a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            text-align: center;
            background: #0b1426;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 380px;
            width: 90%;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #60a5fa;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 1s linear infinite;
            margin: 24px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-msg { font-size: 15px; color: #94a3b8; margin-top: 12px; }
        .error-msg { font-size: 14px; color: #f87171; margin-top: 12px; display: none; }
    </style>
    <script src="/js/env.js"></script>
</head>
<body>
    <div class="card">
        <h2 style="margin:0;font-size:20px;font-weight:700;color:#f8fafc">Completing Google Sign In...</h2>
        <div class="spinner" id="spinner"></div>
        <p class="status-msg" id="statusMsg">Authenticating your account...</p>
        <p class="error-msg" id="errorMsg"></p>
    </div>

    <script type="module">
        import { supabase } from "../js/supabaseClient.js";
        import { login, redirectBasedOnRole, getLoginUrl } from "../js/session.js";

        let callbackProcessed = false;

        async function processOAuthCallback() {
            if (callbackProcessed) return;

            const statusMsg = document.getElementById("statusMsg");
            const errorMsg = document.getElementById("errorMsg");
            if (statusMsg) statusMsg.textContent = "Authenticating your account...";

            try {
                let session = null;
                const searchParams = new URLSearchParams(window.location.search);
                const code = searchParams.get("code");

                // A. PKCE Authorization Code Exchange
                if (code) {
                    console.log("⚡ OAuth callback: authorization code detected");
                    console.log("⚡ OAuth callback: exchanging code");
                    if (statusMsg) statusMsg.textContent = "Exchanging security credentials...";

                    const { data, error } = await supabase.auth.exchangeCodeForSession(code);
                    if (error) {
                        console.error("❌ OAuth callback: exchange error:", error.message);
                        throw error;
                    }
                    if (data && data.session) {
                        session = data.session;
                        console.log("⚡ OAuth callback: Supabase session established");
                    }
                }

                // B. Implicit Hash Fragment Handling (#access_token=...&refresh_token=...)
                if (!session && window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    const accessToken = hashParams.get("access_token");
                    const refreshToken = hashParams.get("refresh_token");

                    if (accessToken && refreshToken) {
                        console.log("⚡ OAuth callback: implicit hash tokens detected");
                        const { data, error } = await supabase.auth.setSession({
                            access_token: accessToken,
                            refresh_token: refreshToken
                        });
                        if (error) {
                            console.error("❌ OAuth callback: setSession error:", error.message);
                            throw error;
                        }
                        if (data && data.session) {
                            session = data.session;
                            console.log("⚡ OAuth callback: Supabase session established via setSession");
                        }
                    }
                }

                // C. Fallback: Existing Active Session Check
                if (!session) {
                    const { data } = await supabase.auth.getSession();
                    session = data?.session || null;
                }

                if (!session || !session.user) {
                    console.warn("⚠️ OAuth callback: No valid session found.");
                    if (errorMsg) {
                        errorMsg.style.display = "block";
                        errorMsg.textContent = "Authentication error: No session returned from provider.";
                    }
                    if (statusMsg) statusMsg.style.display = "none";
                    const spinner = document.getElementById("spinner");
                    if (spinner) spinner.style.display = "none";
                    return;
                }

                callbackProcessed = true;
                console.log("⚡ OAuth callback: user authenticated");

                if (statusMsg) statusMsg.textContent = "Setting up your profile...";

                // Clean OAuth URL params from browser history without refreshing
                try {
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch (e) {}

                const user = session.user;
                const requestedRole = localStorage.getItem("campora_pending_role") || "student";
                localStorage.removeItem("campora_pending_role");

                // Check existing profile in database
                let profile = null;
                try {
                    const { data, error } = await supabase
                        .from("profiles")
                        .select("*")
                        .eq("id", user.id)
                        .maybeSingle();
                    if (!error && data) {
                        profile = data;
                    }
                } catch (e) {}

                // Create profile if missing (never allow creating admin role from client callback)
                if (!profile) {
                    const safeRole = requestedRole === "owner" ? "owner" : "student";
                    const accountStatus = safeRole === "owner" ? "PENDING" : "ACTIVE";
                    const newProfileData = {
                        id: user.id,
                        email: user.email,
                        name: user.user_metadata?.full_name || user.user_metadata?.name || user.email.split("@")[0],
                        avatar: user.user_metadata?.avatar_url || user.user_metadata?.picture || "",
                        role: safeRole,
                        account_status: accountStatus
                    };
                    try {
                        const { data } = await supabase
                            .from("profiles")
                            .upsert(newProfileData)
                            .select()
                            .single();
                        if (data) profile = data;
                    } catch (e) {}
                }

                const finalRole = profile?.role || requestedRole || "student";
                const userObj = {
                    id: user.id,
                    email: user.email,
                    name: profile?.name || user.user_metadata?.name || user.email.split("@")[0],
                    role: finalRole,
                    avatar: profile?.avatar || user.user_metadata?.avatar_url || ""
                };

                // Sync session into CAMPORA session manager
                login(session.access_token, userObj, true);

                // Handle Pending Owner
                if (finalRole === "owner" && profile?.account_status === "PENDING") {
                    window.location.href = getLoginUrl() + "?pending=true";
                    return;
                }

                // Redirect to role dashboard
                redirectBasedOnRole(finalRole);
            } catch (err) {
                console.error("❌ OAuth callback fatal error:", err);
                if (errorMsg) {
                    errorMsg.style.display = "block";
                    errorMsg.textContent = "Authentication error: " + (err.message || "Failed to complete sign in.");
                }
                if (statusMsg) statusMsg.style.display = "none";
                const spinner = document.getElementById("spinner");
                if (spinner) spinner.style.display = "none";
            }
        }

        // Execute processOAuthCallback on DOMReady
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () => processOAuthCallback());
        } else {
            processOAuthCallback();
        }

        // Fallback listener for auth state changes if SIGNED_IN triggers asynchronously
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === "SIGNED_IN" && session && !callbackProcessed) {
                processOAuthCallback();
            }
        });
    </script>
</body>
</html>
