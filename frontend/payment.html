<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Campora | Payments</title>

    <link rel="stylesheet"
href="./css/theme.css">
    <link rel="stylesheet"
href="./css/payment.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>

<body>

<!-- ====================================== -->
<!-- NAVBAR -->
<!-- ====================================== -->

<header class="payment-navbar">

<div class="logo">

<a href="dashboard.html">

<img
src="/images/logo.png"
class="logo-img"
alt="Campora">

</a>

<div>

<h2>Campora</h2>

<p>Student Dashboard</p>

</div>

</div>

<a
href="bookings.html"
class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back to Bookings

</a>

</header>

<!-- ====================================== -->
<!-- MAIN -->
<!-- ====================================== -->

<main class="payment-container" style="display:flex;align-items:center;justify-content:center;min-height:60vh">

<section class="payment-card glass" style="text-align:center;max-width:500px;padding:48px 32px">

<i class="fa-solid fa-credit-card" style="font-size:48px;color:#94a3b8;margin-bottom:16px"></i>

<h1 style="font-size:22px;margin-bottom:12px">
Online Payments Currently Unavailable
</h1>

<p style="color:#64748b;margin-bottom:24px">
Online payment functionality will be introduced in a future Campora release.
</p>

<a href="bookings.html" class="pay-btn" style="display:inline-block;text-decoration:none;text-align:center">
<i class="fa-solid fa-calendar-check"></i> View My Bookings
</a>

</section>

</main>

<!-- ====================================== -->
<!-- TOAST CONTAINER -->
<!-- ====================================== -->

<div id="toastContainer" class="toast-container"></div>

<!-- Payment integration disabled for current production phase.
     Razorpay SDK and payment.js are NOT loaded on this page.
     Retained for future integration. -->

</body>

</html>
