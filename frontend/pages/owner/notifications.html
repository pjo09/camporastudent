<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Campora | Notifications</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="./css/owner-v3.css">
    <link rel="icon" href="./images/logo.png" type="image/png">
</head>
<body class="v3-body">

<div class="v3-bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
</div>

<div id="toastContainer" class="v3-toast-container" aria-live="polite" aria-atomic="true"></div>

<main class="v3-content" id="mainContent" role="main">

    <div class="v3-filter-bar">
        <button class="v3-btn v3-btn-ghost" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </div>

        <div id="notificationsList">
            <div class="v3-loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading notifications...</div>
</div>

</main>

<div id="sidebarBackdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:998" hidden></div>

<script type="module">
import { initShell } from "./js/owner-shell.js";
initShell("Notifications");
</script>
<script type="module" src="./js/owner-notifications.js"></script>
</body>
</html>
