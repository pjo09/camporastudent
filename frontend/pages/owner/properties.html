<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Campora | My Properties</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/owner-v3.css">
    <link rel="icon" href="../../images/logo.png" type="image/png">

    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body class="v3-body">

<div class="v3-bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
</div>

<div id="toastContainer" class="v3-toast-container" aria-live="polite" aria-atomic="true"></div>

<main class="v3-content" id="mainContent" role="main">

        <!-- Filter Bar -->
        <div class="v3-filter-bar">
            <div class="v3-filter-group">
                <button class="v3-filter-btn active" data-filter="all" type="button">All</button>
                <button class="v3-filter-btn" data-filter="approved" type="button">Approved</button>
                <button class="v3-filter-btn" data-filter="pending" type="button">Pending</button>
                <button class="v3-filter-btn" data-filter="rejected" type="button">Rejected</button>
            </div>
            <div class="v3-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="propertySearch" placeholder="Search properties..." aria-label="Search properties">
            </div>
        </div>

        <!-- Stats -->
        <div class="v3-stats-grid" style="margin-bottom:8px">
            <div class="v3-stat-card">
                <div class="v3-stat-icon" style="background:linear-gradient(135deg,#2563eb,#7c3aed)"><i class="fa-solid fa-building"></i></div>
                <div class="v3-stat-title">Total</div>
                <div class="v3-stat-value" id="totalCount">0</div>
            </div>
            <div class="v3-stat-card">
                <div class="v3-stat-icon" style="background:linear-gradient(135deg,#22c55e,#16a34a)"><i class="fa-solid fa-check-circle"></i></div>
                <div class="v3-stat-title">Approved</div>
                <div class="v3-stat-value" id="approvedCount">0</div>
            </div>
            <div class="v3-stat-card">
                <div class="v3-stat-icon" style="background:linear-gradient(135deg,#f59e0b,#d97706)"><i class="fa-solid fa-clock"></i></div>
                <div class="v3-stat-title">Pending</div>
                <div class="v3-stat-value" id="pendingCount">0</div>
            </div>
            <div class="v3-stat-card">
                <div class="v3-stat-icon" style="background:linear-gradient(135deg,#ef4444,#dc2626)"><i class="fa-solid fa-ban"></i></div>
                <div class="v3-stat-title">Rejected</div>
                <div class="v3-stat-value" id="rejectedCount">0</div>
            </div>
        </div>

        <!-- Property Grid -->
        <div id="propertyGrid" class="v3-grid-3">
            <div class="v3-loading" style="grid-column:1/-1"><i class="fa-solid fa-spinner fa-spin"></i> Loading properties...</div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="v3-empty" style="display:none">
            <i class="fa-solid fa-house"></i>
            <h3>No Properties Found</h3>
            <p>Add your first property to start listing on Campora.</p>
            <a href="add-property.html" class="v3-btn v3-btn-primary" style="margin-top:20px"><i class="fa-solid fa-plus"></i> Add Property</a>
        </div>

</main>

<div id="sidebarBackdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:998" hidden></div>

<!-- Share Modal -->
<div class="v3-modal-overlay" id="shareModal">
    <div class="v3-modal">
        <div class="v3-modal-header">
            <h3>Share Property</h3>
            <button class="v3-modal-close" id="closeShareModal" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <p style="color:var(--v3-muted);margin-bottom:16px">Copy the link below to share this property with students.</p>
        <div style="display:flex;gap:10px">
            <input type="text" id="shareLink" readonly style="flex:1;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:14px">
            <button class="v3-btn v3-btn-primary" id="copyShareLink" type="button"><i class="fa-solid fa-copy"></i> Copy</button>
        </div>
    </div>
</div>

<script type="module">
import { initShell } from "../../js/owner-shell.js";
initShell("My Properties");
</script>
<script type="module" src="../../js/owner-properties.js"></script>
</body>
</html>
